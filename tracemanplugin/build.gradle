plugins {
    id 'groovy'
    id 'java-library'
    id 'java-gradle-plugin'
    id 'org.jetbrains.kotlin.jvm'
    id 'maven-publish'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()

    // Android Gradle Plugin 8.x
    implementation 'com.android.tools.build:gradle:8.2.0'
    implementation 'com.android.tools.build:gradle-api:8.2.0'

    // ASM 9.x for modern bytecode support
    implementation 'org.ow2.asm:asm:9.6'
    implementation 'org.ow2.asm:asm-commons:9.6'
    implementation 'org.ow2.asm:asm-util:9.6'

    // Apache Commons
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'commons-codec:commons-codec:1.15'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
}

version = "2.0.0"
group = "cn.cxzheng"

// 声明 Gradle 插件
gradlePlugin {
    plugins {
        traceManPlugin {
            id = 'cn.cxzheng.asmtraceman'
            implementationClass = 'cn.cxzheng.tracemanplugin.TraceManPlugin'
        }
    }
}

sourceSets {
    main {
        groovy {
            srcDir 'src/main/groovy'
        }
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}

compileGroovy {
    dependsOn tasks.named('compileKotlin')
    classpath += files(compileKotlin.destinationDirectory)
}

// Publish to local Maven repository
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = 'cn.cxzheng'
            artifactId = 'asmtraceman-plugin'
            version = '2.0.0'
        }
    }
    repositories {
        maven {
            url = uri('../repo')
        }
    }
}
